<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title"></title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="panel.css">
</head>
<body>

    <div class="back"></div>
    <div class="pfpf">
        <img id="pfp" class="pfp" src="" alt="">
        <p id="name" class="myname">
        </p>
        <p class="acount">
            MY ACCOUNTS
        </p>
    </div>
    
    <canvas id="canvas"></canvas>
    <div class="cards">
        <a id="youtube" href="">
        <div class="card one"><div class="cycle c1"></div><p class="social">YOUTUBE</p><img class="icon" src="icons8-youtube-96.png" alt=""></div>
        </a>
        <a id="instagram" href="">
        <div class="card two"><div class="cycle c2"></div><p class="social">INSTAGRAM</p><img class="icon" src="icons8-instagram-96.png" alt=""></div>
        </a>
        <a id="discord" href="">
        <div class="card three"><div class="cycle c4"></div><p class="social">DISCORD</p><img class="icon" src="icons8-discord-96.png" alt=""></div>
        </a>
        <a id="tiktok" href="">
        <div class="card four"><div class="cycle c5"></div><p class="social">TIKTOK</p><img class="icon" src="icons8-tiktok-96.png" alt=""></div>
        </a>
        <a id="facebook" href="">
        <div class="card five"><div class="cycle c6"></div><p class="social">FACEBOOK</p><img class="icon facebook" src="icons8-facebook-96.png" alt=""></div>
        </a>
        <a id="telegram" href="">
        <div class="card six"><div class="cycle c7"></div><p class="social patreons">TELEGRAM</p><img class="icon telegram" src="icons8-telegram-app-96.png" alt=""></div>
        </a>
   <!-- Mobile Control Toggle Button -->
<button id="mobile-control-btn" aria-label="Controls">⚙️ Controls</button>

<!-- Glassmorphism Control Panel -->
<div id="mobile-control-panel" class="panel-hidden">
  <div class="panel-header">
    <span>Scene Customizer</span>
    <button id="close-panel-btn">✕</button>
  </div>
  
  <div class="control-group">
    <label for="bg-color">Background Color</label>
    <input type="color" id="bg-color" value="#000000">
  </div>

  <div class="control-group">
    <label for="light-color">Light Color</label>
    <input type="color" id="light-color" value="#ffffff">
  </div>

  <div class="control-group">
    <label for="object-scale">Object Scale (Size)</label>
    <input type="range" id="object-scale" min="0.5" max="2" step="0.1" value="1">
  </div>

  <div class="control-group">
    <label for="rotation-speed">Rotation Speed</label>
    <input type="range" id="rotation-speed" min="0" max="0.05" step="0.005" value="0.01">
  </div>

  <div class="control-group">
    <label for="light-pos-x">Light (X Axis)</label>
    <input type="range" id="light-pos-x" min="-10" max="10" step="0.1" value="-6">
  </div>

  <div class="control-group">
    <label for="light-pos-y">Light (Y Axis)</label>
    <input type="range" id="light-pos-y" min="-10" max="10" step="0.1" value="4">
  </div>

  <div class="control-group">
    <label for="moon-pos-x">Moon (X Axis)</label>
    <input type="range" id="moon-pos-x" min="-3" max="3" step="0.1" value="0">
  </div>

  <div class="control-group">
    <label for="moon-pos-y">Moon (Y Axis)</label>
    <input type="range" id="moon-pos-y" min="-3" max="3" step="0.1" value="0">
  </div>

  <button id="reset-scene-btn">Reset Default</button>
</div>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
    <script src="three.js" type="module"></script>
    <script src="config.js"></script>
</body>
</html>
